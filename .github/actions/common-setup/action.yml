name: 'Checkout and Set up Python'
description: 'Checkout and setup Python'
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Load cached venv
      uses: actions/cache@v4
      with:
        path: ~/.cache/venv-ci
        key: ${{ env.pythonLocation }}-${{ hashFiles('dev-requirements.txt') }}

    - name: Create venv if cache miss
      shell: bash
      run: |
        if [ ! -f ~/.cache/venv-ci/bin/activate ]; then
          python -m venv ~/.cache/venv-ci
          source ~/.cache/venv-ci/bin/activate
          pip install -r dev-requirements.txt
        fi
