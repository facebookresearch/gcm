apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gcm.fullname" . }}-test"
  labels:
    {{- include "gcm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: gcm-test
      image: {{ include "gcm.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["gcm", "--help"]
    - name: health-checks-test
      image: {{ include "gcm.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["health_checks", "--help"]
  restartPolicy: Never
